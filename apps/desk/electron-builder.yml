# Builds the SGM Desk installer for Windows (run "npm run desk:dist" from the repo root).
# The installer lands in apps/desk/release/.
appId: ph.sibugaygas.sgmdesk
productName: SGM Desk
copyright: Copyright © 2026 Sibugay Gas Marketing
directories:
  # Made by scripts/build-electron.mjs: the bundled Electron code plus the screens.
  app: build/app
  output: release
  buildResources: build-resources
npmRebuild: false
# Everything the app needs is already bundled into build/app, so no node_modules are shipped.
files:
  - "**/*"
  - "!**/node_modules/**"
win:
  target: nsis
  icon: build-resources/icon.png
# One-click and per Windows user (no administrator password), so updates install without asking anyone.
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: SGM Desk
  artifactName: SGM-Desk-Setup-${version}.${ext}
# Automatic updates: installed copies ask the SGM API, which serves the files from the private
# releases repo to signed-in, approved PCs (electron/updates.ts). This also makes each build write
# latest.yml next to the installer; upload all three with "npm run desk:release".
publish:
  provider: generic
  url: https://cmpyttciealvhgkpuhoq.supabase.co/functions/v1/api/updates/desk

# Receipt scanning: scripts/stage-ocr.cjs gathers the models and ONNX Runtime
# into build/ocr before packing, and these copy them into resources/.
beforePack: scripts/stage-ocr.cjs
extraResources:
  - from: build/ocr/models
    to: models
  - from: build/ocr/node_modules
    to: node_modules
